name: Release Spec Kit component

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install packaging pathspec PyYAML

      - name: Validate tag and package component
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import zipfile
          from pathlib import Path

          import yaml
          from packaging.version import InvalidVersion, Version
          from pathspec import GitIgnoreSpec

          tag = os.environ["RELEASE_TAG"]
          components = {
              "extension": ("extensions", "extension.yml"),
              "preset": ("presets", "preset.yml"),
          }
          try:
              component_id, version = tag.rsplit("-v", 1)
          except ValueError as exc:
              raise SystemExit(
                  f"Tag {tag!r} must end with '-v<version>'"
              ) from exc

          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", component_id):
              raise SystemExit(f"Invalid component ID in tag: {component_id!r}")
          try:
              Version(version)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 version in tag: {version!r}") from exc

          candidates = []
          for kind, (package_root, manifest_name) in components.items():
              package_dir = Path(package_root) / component_id
              manifest_path = package_dir / manifest_name
              if manifest_path.is_file():
                  candidates.append((kind, package_dir, manifest_path, manifest_name))
          if not candidates:
              raise SystemExit(f"No component found for tag ID {component_id!r}")
          if len(candidates) > 1:
              raise SystemExit(
                  f"Tag ID {component_id!r} is ambiguous; extension and preset "
                  "IDs must be unique"
              )
          kind, package_dir, manifest_path, manifest_name = candidates[0]

          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          if not isinstance(manifest, dict) or not isinstance(manifest.get(kind), dict):
              raise SystemExit(f"Invalid {kind} manifest: {manifest_path}")
          component = manifest[kind]
          if component.get("id") != component_id:
              raise SystemExit(
                  f"Manifest ID {component.get('id')!r} does not match tag ID "
                  f"{component_id!r}"
              )
          if str(component.get("version")) != version:
              raise SystemExit(
                  f"Manifest version {component.get('version')!r} does not match "
                  f"tag version {version!r}"
              )

          ignore_path = package_dir / ".extensionignore" if kind == "extension" else None
          ignored = None
          if ignore_path and ignore_path.is_file():
              ignored = GitIgnoreSpec.from_lines(
                  ignore_path.read_text(encoding="utf-8").splitlines()
              )

          dist_dir = Path("dist")
          dist_dir.mkdir(exist_ok=True)
          archive = dist_dir / f"{component_id}-{version}.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
              for path in sorted(package_dir.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(f"{kind.capitalize()} packages cannot contain symlinks: {path}")
                  if not path.is_file():
                      continue
                  relative_path = path.relative_to(package_dir).as_posix()
                  if kind == "extension" and relative_path == ".extensionignore":
                      continue
                  if ignored and ignored.match_file(relative_path):
                      continue
                  output.write(path, relative_path)

          with zipfile.ZipFile(archive) as package:
              if manifest_name not in package.namelist():
                  raise SystemExit(f"Package archive is missing its root {manifest_name}")
              bad_member = package.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt archive member: {bad_member}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive={archive}\n")
          print(f"Packaged {kind} {component_id} {version}: {archive}")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "$RELEASE_TAG" "$ARCHIVE" --verify-tag --generate-notes
