schema_version: "1.0"

preset:
  id: "egm-opencode-subagents"
  name: "EGM OpenCode Sub-Agent Delegation"
  version: "1.3.0"
  description: "Adds sub-agent delegation instructions to EGM Spec Kit workflow commands, enabling parallel execution of independent steps via OpenCode sub-agents."
  author: "Kapil Sachdeva"
  repository: "https://github.com/ksachdeva/spec-kit-extensions"
  license: "MIT"

requires:
  speckit_version: ">=0.8.0"
  extensions:
    - id: egm
      version: ">=1.5.0"
      required: true

provides:
  templates:
    - type: "command"
      name: "speckit.egm.brainstorm"
      file: "commands/sub-agent.md"
      description: "Prepend sub-agent delegation for brainstorming ideas"
      replaces: "speckit.egm.brainstorm"
      strategy: "prepend"
    - type: "command"
      name: "speckit.egm.draft"
      file: "commands/sub-agent.md"
      description: "Prepend sub-agent delegation for drafting"
      replaces: "speckit.egm.draft"
      strategy: "prepend"
    - type: "command"
      name: "speckit.egm.bootstrap"
      file: "commands/sub-agent.md"
      description: "Prepend sub-agent delegation for bootstrapping"
      replaces: "speckit.egm.bootstrap"
      strategy: "prepend"
    - type: "command"
      name: "speckit.egm.review-loop"
      file: "commands/sub-agent.md"
      description: "Prepend sub-agent delegation for review loops"
      replaces: "speckit.egm.review-loop"
      strategy: "prepend"
    - type: "command"
      name: "speckit.egm.review"
      file: "commands/sub-agent.md"
      description: "Prepend sub-agent delegation for reviews"
      replaces: "speckit.egm.review"
      strategy: "prepend"

tags:
  - "opencode"
  - "sub-agents"
  - "egm"
  - "parallelism"
  - "performance"
