[tool.poe.tasks]
fmt = "uv format --preview-features format"
pre-commit = "uv run pre-commit run --all--files"

[tool.poe.tasks.release-extension]
script = "scripts.release_component:release_extension(extension, version, _dry_run)"
help = "Tag and publish one extension release"
args = [
    { name = "extension", positional = true, help = "Extension ID under extensions/" },
    { name = "version", positional = true, help = "Version already set in extension.yml" },
]

[tool.poe.tasks.release-preset]
script = "scripts.release_component:release_preset(preset, version, _dry_run)"
help = "Tag and publish one preset release"
args = [
    { name = "preset", positional = true, help = "Preset ID under presets/" },
    { name = "version", positional = true, help = "Version already set in preset.yml" },
]

[tool.poe.groups.opencode]
heading = "SpecKit Opencode"

[tool.poe.groups.opencode.tasks.opencode-demo-init]
cmd = "uv run specify init examples/demo-app --integration opencode"

[tool.poe.groups.opencode.tasks.opencode-demo-add-egm]
env = { SPECIFY_INIT_DIR = "examples/demo-app" }
sequence = [
     {cmd = "uv run specify extension add --dev ${POE_GIT_ROOT}/extensions/egm --force" },
     {cmd = "uv run specify preset remove egm-opencode-subagents" },
     {cmd = "uv run specify preset add --dev ${POE_GIT_ROOT}/presets/egm-opencode-subagents" }
]

[tool.poe.groups.opencode.tasks.opencode-demo-run]
env = { SPECIFY_INIT_DIR = "examples/demo-app" }
cwd = "examples/demo-app"
cmd = "opencode"
